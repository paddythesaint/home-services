name: Record maintenance (one-shot)

# Manually-triggered, founder-requested production maintenance. The
# script it runs is guarded and idempotent — see scripts/recordMaintenance.mjs
# for exactly what the current one-shot does.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        run: npm install firebase-admin@12 --no-save

      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp-sa.json"

      - name: Run maintenance
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/recordMaintenance.mjs
